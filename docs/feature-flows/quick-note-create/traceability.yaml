version: 1
feature_id: "quick-note.create"
title: "Create a quick note"
status: "implemented"

characteristics:
  cross_component: true
  asynchronous: true
  persisted_state: true
  external_dependencies: false
  retry_or_compensation: false
  security_sensitive: false

nodes:
  E1:
    kind: entry
    description: Open the quick-note window from the global shortcut, tray, or main window
    trigger: User requests a new quick note
    code:
      - path: src-tauri/src/application/hotkey.rs
        symbol: on_shortcut_pressed
        role: global shortcut entry
      - path: src/App.tsx
        symbol: openQuickNoteWindow
        role: main-window entry

  A1:
    kind: action
    description: Reset a newly shown quick-note draft and focus the body editor
    code:
      - path: src/features/quick-note/index.tsx
        symbol: reset
        role: draft lifecycle
    tests:
      - path: src/features/quick-note/quick-note.test.tsx
        symbol: 收到 reset 事件时清空 Draft 并重新请求颜色

  A7:
    kind: action
    description: Request previously persisted tags as reusable input suggestions
    code:
      - path: src/features/quick-note/index.tsx
        symbol: loadTagSuggestions
        role: suggestion loading
      - path: src/desktop-api/tauri-adapter.ts
        symbol: listTags
        role: Tauri bridge
    tests:
      - path: src/features/quick-note/quick-note.test.tsx
        symbol: supports freeform tags and reusable tag suggestions

  D7:
    kind: decision
    description: Decide whether reusable tag suggestions loaded successfully
    condition: DesktopApi.listTags resolves with tag names or rejects
    code:
      - path: src/features/quick-note/index.tsx
        symbol: loadTagSuggestions
    tests:
      - path: src/features/quick-note/quick-note.test.tsx
        symbol: tag suggestion failure keeps freeform input available
      - path: src/features/quick-note/quick-note.test.tsx
        symbol: supports freeform tags and reusable tag suggestions

  A8:
    kind: action
    description: Keep user-authored tag input available without historical suggestions
    code:
      - path: src/features/quick-note/index.tsx
        symbol: loadTagSuggestions
        role: non-blocking fallback
    tests:
      - path: src/features/quick-note/quick-note.test.tsx
        symbol: tag suggestion failure keeps freeform input available

  A2:
    kind: action
    description: Edit body content, write new tags or reuse historical tags, and optionally select Agent bindings in a compact frameless note
    code:
      - path: src/features/quick-note/index.tsx
        symbol: QuickNoteWindow
        role: interaction surface
      - path: src/components/shared/TagInput.tsx
        symbol: TagInput
        role: freeform and reusable tag input
    tests:
      - path: src/features/quick-note/quick-note.test.tsx
        symbol: renders a compact frameless note without a title control
      - path: src/features/quick-note/quick-note.test.tsx
        symbol: supports freeform tags and reusable tag suggestions
      - path: e2e/layout.spec.ts
        symbol: compact quick note keeps controls separate and inside the viewport

  D1:
    kind: decision
    description: Decide whether the draft has the minimum valid create input
    condition: Trimmed body content is non-empty; Agent bindings may be empty
    code:
      - path: src/features/quick-note/index.tsx
        symbol: canSave
    tests:
      - path: src/features/quick-note/quick-note.test.tsx
        symbol: 空内容不能保存
      - path: src/features/quick-note/quick-note.test.tsx
        symbol: content-only draft can be saved without an Agent

  X1:
    kind: outcome
    description: Empty content remains editable without a create call
    result: Save stays disabled and no persistent side effect occurs

  D2:
    kind: decision
    description: Decide whether another save request is already in flight
    condition: savingRef.current is true only while createTip is pending
    code:
      - path: src/features/quick-note/index.tsx
        symbol: savingRef
    tests:
      - path: src/features/quick-note/quick-note.test.tsx
        symbol: 连续按键不会重复提交
      - path: src/features/quick-note/quick-note.test.tsx
        symbol: Ctrl+Enter 触发一次提交

  X2:
    kind: outcome
    description: A duplicate submission is ignored
    result: Only the existing create request continues and no duplicate Tip is produced

  A3:
    kind: action
    description: Submit no title, body content, normalized user-authored tags, and zero or more Agent bindings through DesktopApi
    code:
      - path: src/features/quick-note/index.tsx
        symbol: submit
        role: create orchestration
      - path: src/desktop-api/tauri-adapter.ts
        symbol: createTip
        role: Tauri bridge
    tests:
      - path: src/features/quick-note/quick-note.test.tsx
        symbol: content-only draft can be saved without an Agent
      - path: src/features/quick-note/quick-note.test.tsx
        symbol: saves pending tag input without requiring Enter
      - path: src-tauri/src/domain/tips.rs
        symbol: missing_title_stays_empty

  D3:
    kind: decision
    description: Branch on the asynchronous createTip result
    condition: createTip resolves successfully or rejects with an error
    code:
      - path: src/features/quick-note/index.tsx
        symbol: submit
    tests:
      - path: src/features/quick-note/tauri-flow.test.tsx
        symbol: createTip
      - path: src/features/quick-note/quick-note.test.tsx
        symbol: long save errors remain fully readable

  X3:
    kind: outcome
    description: Failed creation remains recoverable in the open quick-note window
    result: A complete scrollable alert is shown while body content, pending and selected tags, and Agent bindings remain intact

  T1:
    kind: transition
    description: Atomically persist a titleless Tip, normalized tag records and links, and zero or more Agent bindings
    entity: Tip aggregate
    from: ABSENT
    to: ACTIVE
    trigger: Valid quick-note create command
    code:
      - path: src-tauri/src/application/tips.rs
        symbol: create
        role: application service
      - path: src-tauri/src/adapters/sqlite.rs
        symbol: create_with_bindings
        role: atomic Tip, tag, Tip-Tag, and binding persistence
    tests:
      - path: src-tauri/src/adapters/sqlite.rs
        symbol: create_with_tags_round_trips

  A4:
    kind: action
    description: Show success feedback, clear the draft, and hide the quick-note window
    code:
      - path: src/features/quick-note/index.tsx
        symbol: hideQuickNote
        role: success completion
    tests:
      - path: src/features/quick-note/quick-note.test.tsx
        symbol: 保存成功后约 300ms 隐藏窗口并清空 Draft

  X4:
    kind: outcome
    description: The created Tip is available to the main note library
    result: The quick-note window is hidden and the titleless Tip with tags can be read and displayed in the main note library
    tests:
      - path: src/features/quick-note/tauri-flow.test.tsx
        symbol: titleless tagged quick note appears in the main library

  E2:
    kind: entry
    description: Request to close quick note from Esc, the in-app control, or the native titlebar
    trigger: User requests quick-note close
    code:
      - path: src/features/quick-note/index.tsx
        symbol: requestClose
        role: frontend close coordinator
      - path: src-tauri/src/lib.rs
        symbol: on_window_event
        role: native titlebar close bridge

  D4:
    kind: decision
    description: Decide whether close may interrupt a pending save
    condition: savingRef.current is true while createTip has not settled
    code:
      - path: src/features/quick-note/index.tsx
        symbol: savingRef
    tests:
      - path: src/features/quick-note/quick-note.test.tsx
        symbol: close during save keeps the window open
      - path: src/features/quick-note/quick-note.test.tsx
        symbol: Esc asks before discarding a non-empty draft

  X5:
    kind: outcome
    description: Close request is ignored while save is in flight
    result: Window and draft stay visible until the existing save resolves or rejects

  D5:
    kind: decision
    description: Decide whether closing would discard user work
    condition: Trimmed body or pending tag text is non-empty, or at least one tag or Agent binding has been selected
    code:
      - path: src/features/quick-note/index.tsx
        symbol: hasUnsavedDraftRef
    tests:
      - path: src/features/quick-note/quick-note.test.tsx
        symbol: empty draft closes without confirmation
      - path: src/features/quick-note/quick-note.test.tsx
        symbol: Esc asks before discarding a non-empty draft
      - path: src/features/quick-note/quick-note.test.tsx
        symbol: tag-only draft asks before discarding

  A5:
    kind: action
    description: Clear the draft session and hide the quick-note window
    code:
      - path: src/features/quick-note/index.tsx
        symbol: discardAndHide
    tests:
      - path: src/features/quick-note/quick-note.test.tsx
        symbol: discard confirmation clears and hides the draft

  A6:
    kind: action
    description: Show a compact confirmation before discarding unsaved work
    code:
      - path: src/features/quick-note/index.tsx
        symbol: setDiscardConfirmOpen
      - path: src/components/shared/ConfirmActionDialog.tsx
        symbol: ConfirmActionDialog
    tests:
      - path: e2e/phase1.spec.ts
        symbol: dirty quick note requires discard confirmation from keyboard and close button

  D6:
    kind: decision
    description: Decide whether the user explicitly confirms discard
    condition: User chooses Discard content or Continue editing
    code:
      - path: src/features/quick-note/index.tsx
        symbol: confirmDiscard
    tests:
      - path: src/features/quick-note/quick-note.test.tsx
        symbol: discard confirmation clears and hides the draft
      - path: src/features/quick-note/quick-note.test.tsx
        symbol: cancel discard keeps the draft

  X6:
    kind: outcome
    description: User cancels discard and continues editing
    result: Confirmation closes, input remains unchanged, and focus returns to the body

  X7:
    kind: outcome
    description: Quick note closes without creating a Tip
    result: Empty or explicitly discarded draft is cleared and the window is hidden

  G1:
    kind: safeguard
    description: Validate body content before persistence
    safeguard_type: validation
    guarantee: Empty content causes no create side effect while missing Agent bindings remain valid
    protects: [D1, A3]
    failure_behavior: Keep Save disabled only when the body is empty
    code:
      - path: src/features/quick-note/index.tsx
        symbol: canSave
    tests:
      - path: src/features/quick-note/quick-note.test.tsx
        symbol: content-only draft can be saved without an Agent

  G2:
    kind: safeguard
    description: Suppress concurrent duplicate submissions
    safeguard_type: idempotency
    guarantee: A rapid click or keyboard repeat starts at most one in-flight create call
    protects: [D2, A3]
    failure_behavior: Ignore additional submit attempts until the active call settles
    code:
      - path: src/features/quick-note/index.tsx
        symbol: savingRef
    tests:
      - path: src/features/quick-note/quick-note.test.tsx
        symbol: 连续按键不会重复提交

  G3:
    kind: safeguard
    description: Preserve user input and expose the complete error when persistence fails
    safeguard_type: integrity
    guarantee: A failed save does not clear content, pending or selected tags, bindings, or hide the window, and the complete error remains readable and selectable
    protects: [X3]
    failure_behavior: Show a bounded scrollable alert and allow an explicit user retry
    code:
      - path: src/features/quick-note/index.tsx
        symbol: setError
    tests:
      - path: src/features/quick-note/quick-note.test.tsx
        symbol: long save errors remain fully readable

  G4:
    kind: safeguard
    description: Keep the compact note, error, and discard confirmation usable without visual overlap
    safeguard_type: integrity
    guarantee: At default and minimum sizes the body, horizontal tag editor, Agent bindings, and actions do not overlap and every close or save control remains reachable
    protects: [A2, A6]
    failure_behavior: Bounded scroll regions and a viewport-aware dialog absorb reduced space without hiding actions
    code:
      - path: src/features/quick-note/index.tsx
        symbol: quick-note-shell
      - path: src/components/shared/ConfirmActionDialog.tsx
        symbol: contentClassName
    tests:
      - path: e2e/layout.spec.ts
        symbol: compact quick note keeps controls separate and inside the viewport
      - path: e2e/phase1.spec.ts
        symbol: dirty quick note requires discard confirmation from keyboard and close button

  G5:
    kind: safeguard
    description: Route every close trigger through the same unsaved-draft guard
    safeguard_type: integrity
    guarantee: Unsaved body content, pending or selected tags, and Agent bindings cannot be cleared or hidden without explicit user confirmation
    protects: [D5, A5, X7]
    failure_behavior: Keep the quick-note window visible if confirmation is cancelled or the native event listener is unavailable
    code:
      - path: src/features/quick-note/index.tsx
        symbol: requestClose
      - path: src-tauri/src/lib.rs
        symbol: QuickNoteCloseAction
    tests:
      - path: src/features/quick-note/quick-note.test.tsx
        symbol: native close request asks before discarding a non-empty draft
      - path: src-tauri/src/lib.rs
        symbol: quick_note_native_close_requests_confirmation

  G6:
    kind: safeguard
    description: Normalize, deduplicate, and bound user-authored tags
    safeguard_type: validation
    guarantee: Persisted tags have no leading hash or surrounding whitespace, are unique case-insensitively, and cannot exceed the supported count or length
    protects: [A3, T1]
    failure_behavior: Reject an invalid tag set before the transaction creates a Tip
    code:
      - path: src-tauri/src/domain/tips.rs
        symbol: normalize_tags
    tests:
      - path: src-tauri/src/domain/tips.rs
        symbol: tags_are_trimmed_deduplicated_and_bounded

  G7:
    kind: safeguard
    description: Commit the Tip aggregate and all relationships atomically
    safeguard_type: atomicity
    guarantee: A create attempt cannot leave a Tip, new tag, Tip-Tag link, or Agent binding partially persisted
    protects: [T1]
    failure_behavior: Roll back the complete SQLite transaction and return the persistence error
    code:
      - path: src-tauri/src/adapters/sqlite.rs
        symbol: create_with_bindings
    tests:
      - path: src-tauri/src/adapters/sqlite.rs
        symbol: tag_constraint_failure_rolls_back_tip_and_bindings

  G8:
    kind: safeguard
    description: Treat historical tag suggestions as a non-blocking enhancement
    safeguard_type: integrity
    guarantee: Failure to list historical tags never disables freeform tag entry or Tip creation
    protects: [A8, A2]
    failure_behavior: Use an empty suggestion list and keep the tag input enabled
    code:
      - path: src/features/quick-note/index.tsx
        symbol: loadTagSuggestions
    tests:
      - path: src/features/quick-note/quick-note.test.tsx
        symbol: tag suggestion failure keeps freeform input available
